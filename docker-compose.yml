# jeo-claw topology. Only the allowlisted proxy reaches the edge network;
# control and runtime services remain on the internal network.

networks:
  edge:
    driver: bridge
  claw_internal:
    driver: bridge
    internal: true

volumes:
  hive_state:

  zeroclaw_researcher_coder_state:
  zeroclaw_researcher_coder_work:
  zeroclaw_reviewer_state:
  zeroclaw_reviewer_work:
  zeroclaw_pr_creator_state:
  zeroclaw_pr_creator_work:
  zeroclaw_pr_review_scheduler_state:
  zeroclaw_pr_review_scheduler_work:
  zeroclaw_merger_state:
  zeroclaw_merger_work:
  nullclaw_researcher_coder_state:
  nullclaw_researcher_coder_work:
  nullclaw_reviewer_state:
  nullclaw_reviewer_work:
  nullclaw_pr_creator_state:
  nullclaw_pr_creator_work:
  nullclaw_pr_review_scheduler_state:
  nullclaw_pr_review_scheduler_work:
  nullclaw_merger_state:
  nullclaw_merger_work:
x-runtime: &runtime
  restart: unless-stopped
  networks: [claw_internal]
  depends_on:
    egress-proxy:
      condition: service_healthy
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp
    - /run
  healthcheck:
    test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:\" + process.env.JEO_RUNTIME_PORT + \"/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
    interval: 30s
    timeout: 5s
    retries: 3

x-runtime-env: &runtime-env
  HTTP_PROXY: http://egress-proxy:3128
  HTTPS_PROXY: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,claw-hive,egress-proxy
  GCLOUD_PROJECT: ${GCLOUD_PROJECT}
  GCLOUD_SECRET_PREFIX: ${GCLOUD_SECRET_PREFIX}
  TARGET_REPO: ${TARGET_REPO}
  TARGET_BRANCH: ${TARGET_BRANCH}
  LLM_MODEL: ${LLM_MODEL:-gpt-6.1-terra}
  OPENAI_WIRE_API: ${OPENAI_WIRE_API:-responses}
  JEO_SECRET_SOURCE: ${JEO_SECRET_SOURCE:-gcloud}
  JEO_SECRETS_FILE: ${JEO_SECRETS_FILE:-}
  CLOUDSDK_CONFIG: /tmp/gcloud

services:
  egress-proxy:
    image: ubuntu/squid:latest
    user: "13:13"
    restart: unless-stopped
    networks:
      - edge
      - claw_internal
    volumes:
      - ./compose/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./compose/egress-proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=13,gid=13,mode=1777
      - /run:uid=13,gid=13,mode=0755
      - /var/log/squid:uid=13,gid=13,mode=0755
      - /var/spool/squid:uid=13,gid=13,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  claw-hive:
    build:
      context: .
      dockerfile: hive/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      - claw_internal
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,egress-proxy,github-api-mock,zeroclaw-researcher-coder,zeroclaw-reviewer,zeroclaw-pr-creator,zeroclaw-pr-review-scheduler,zeroclaw-merger,nullclaw-researcher-coder,nullclaw-reviewer,nullclaw-pr-creator,nullclaw-pr-review-scheduler,nullclaw-merger
      GLUE_PORT: ${GLUE_PORT:-8787}
      GITHUB_WEBHOOK_PATH: ${GITHUB_WEBHOOK_PATH:-/webhook/github}
      GLUE_EVENT_ENDPOINT: http://127.0.0.1:8787
      GCLOUD_PROJECT: ${GCLOUD_PROJECT}
      GCLOUD_SECRET_PREFIX: ${GCLOUD_SECRET_PREFIX}
      TARGET_REPO: ${TARGET_REPO}
      TARGET_BRANCH: ${TARGET_BRANCH}
      ALLOWED_REPO_OWNERS: ${ALLOWED_REPO_OWNERS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-6.1-terra}
      OPENAI_WIRE_API: ${OPENAI_WIRE_API}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_REQUEST_CHANNEL_ID: ${DISCORD_REQUEST_CHANNEL_ID}
      DISCORD_STATUS_CHANNEL_ID: ${DISCORD_STATUS_CHANNEL_ID}
      DISCORD_APPROVAL_CHANNEL_ID: ${DISCORD_APPROVAL_CHANNEL_ID}
      DISCORD_DASHBOARD_CHANNEL_ID: ${DISCORD_DASHBOARD_CHANNEL_ID}
      DISCORD_APPROVER_ROLE_ID: ${DISCORD_APPROVER_ROLE_ID}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
      JEO_SECRET_SOURCE: ${JEO_SECRET_SOURCE:-gcloud}
      JEO_SECRETS_FILE: ${JEO_SECRETS_FILE:-}
      JEO_ALLOW_SELF_TEST: ${JEO_ALLOW_SELF_TEST:-}
      JEO_STATUS_ENDPOINT: ${JEO_STATUS_ENDPOINT:-http://127.0.0.1:9100/status}
      AUTONOMY: ${AUTONOMY:-}
      SQLITE_DB_PATH: /data/workflows.sqlite
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /root/.config/gcloud
      - /root/.cache
    ports:
      - "127.0.0.1:${GLUE_HOST_PORT:-8787}:8787"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - hive_state:/data
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:8787/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3

    develop:
      watch:
        - action: sync
          path: ./glue
          target: /app/glue
        - action: sync
          path: ./discord
          target: /app/discord
        - action: sync
          path: ./claws
          target: /app/claws
        - action: sync
          path: ./hive
          target: /app/hive
        - action: sync
          path: ./runtimes
          target: /app/runtimes
        - action: sync
          path: ./config
          target: /app/config
        - action: sync
          path: ./scripts
          target: /app/scripts
        - action: sync
          path: ./compare
          target: /app/compare
        - action: sync
          path: ./control
          target: /app/control
        - action: rebuild
          path: package.json
        - action: rebuild
          path: bun.lock

  zeroclaw-researcher-coder:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/zeroclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: zeroclaw, JEO_ROLE: researcher-coder, JEO_RUNTIME_PORT: "9201"}
    volumes: ["zeroclaw_researcher_coder_state:/root/.zeroclaw", "zeroclaw_researcher_coder_work:/workspace"]
  zeroclaw-reviewer:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/zeroclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: zeroclaw, JEO_ROLE: reviewer, JEO_RUNTIME_PORT: "9202"}
    volumes: ["zeroclaw_reviewer_state:/root/.zeroclaw", "zeroclaw_reviewer_work:/workspace"]
  zeroclaw-pr-creator:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/zeroclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: zeroclaw, JEO_ROLE: pr-creator, JEO_RUNTIME_PORT: "9203"}
    volumes: ["zeroclaw_pr_creator_state:/root/.zeroclaw", "zeroclaw_pr_creator_work:/workspace"]
  zeroclaw-pr-review-scheduler:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/zeroclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: zeroclaw, JEO_ROLE: pr-review-scheduler, JEO_RUNTIME_PORT: "9204"}
    volumes: ["zeroclaw_pr_review_scheduler_state:/root/.zeroclaw", "zeroclaw_pr_review_scheduler_work:/workspace"]
  zeroclaw-merger:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/zeroclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: zeroclaw, JEO_ROLE: merger, JEO_RUNTIME_PORT: "9205"}
    volumes: ["zeroclaw_merger_state:/root/.zeroclaw", "zeroclaw_merger_work:/workspace"]
  nullclaw-researcher-coder:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/nullclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: nullclaw, JEO_ROLE: researcher-coder, JEO_RUNTIME_PORT: "9201"}
    volumes: ["nullclaw_researcher_coder_state:/root/.config/nullclaw", "nullclaw_researcher_coder_work:/workspace"]
  nullclaw-reviewer:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/nullclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: nullclaw, JEO_ROLE: reviewer, JEO_RUNTIME_PORT: "9202"}
    volumes: ["nullclaw_reviewer_state:/root/.config/nullclaw", "nullclaw_reviewer_work:/workspace"]
  nullclaw-pr-creator:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/nullclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: nullclaw, JEO_ROLE: pr-creator, JEO_RUNTIME_PORT: "9203"}
    volumes: ["nullclaw_pr_creator_state:/root/.config/nullclaw", "nullclaw_pr_creator_work:/workspace"]
  nullclaw-pr-review-scheduler:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/nullclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: nullclaw, JEO_ROLE: pr-review-scheduler, JEO_RUNTIME_PORT: "9204"}
    volumes: ["nullclaw_pr_review_scheduler_state:/root/.config/nullclaw", "nullclaw_pr_review_scheduler_work:/workspace"]
  nullclaw-merger:
    <<: *runtime
    build: {context: ., dockerfile: runtimes/nullclaw/Dockerfile}
    environment: {<<: *runtime-env, JEO_RUNTIME: nullclaw, JEO_ROLE: merger, JEO_RUNTIME_PORT: "9205"}
    volumes: ["nullclaw_merger_state:/root/.config/nullclaw", "nullclaw_merger_work:/workspace"]

  github-api-mock:
    profiles:
      - test
    build:
      context: .
      dockerfile: hive/Dockerfile
    command: ["bun", "run", "scripts/mock-github.ts"]
    networks:
      - claw_internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
